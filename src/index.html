:root{
  --bg:#07080a;--panel:#0d0f12;--panel2:#15181c;--text:#eceef1;--muted:#868d97;--line:#1c2026;
  --isl:#0a0b0e;--gap:10px;--accent:#ffffff;--on-accent:#07080a;--logo:#ffffff;--r:12px;--fs:16px;--pad:20px;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#f3f3f1;--isl:#f8f8f6;--panel:#ffffff;--panel2:#ebebe8;--text:#1b1d21;--muted:#6b7078;--line:#d9dad6;--accent:#1b1d21;--on-accent:#ffffff;--logo:#1b1d21;color-scheme:light}
*{box-sizing:border-box}
html,body{-webkit-user-select:none;user-select:none;cursor:default}
a,img,svg{-webkit-user-drag:none}
html,body{height:100%;margin:0}

button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%;padding:0 var(--gap) var(--gap);gap:var(--gap)}
.app::before{content:"";position:fixed;top:0;left:0;right:0;height:56px;-webkit-app-region:drag;pointer-events:none}
.top{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);height:46px;margin-top:var(--gap);padding:0 138px 0 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;-webkit-app-region:drag;user-select:none}
.tabs{display:flex;gap:6px;justify-content:center;-webkit-app-region:no-drag;position:relative;isolation:isolate}
.pill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:calc(var(--r) - 2px);background:var(--accent);pointer-events:none;z-index:0;will-change:transform,width}
.brand{display:flex;align-items:center;gap:10px;flex:none}

.pill{transition:opacity .25s ease}
.nav.st[aria-current="page"],.nav.st[aria-current="page"]:hover{background:var(--accent);color:var(--on-accent)}
.nav{background:none;border:0;padding:9px 13px;border-radius:calc(var(--r) - 2px);display:flex;gap:0;align-items:center;color:var(--muted);font-weight:500;flex:none;position:relative;transition:color .4s ease}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--panel2);opacity:0;z-index:-1;transition:opacity .25s ease;pointer-events:none}
.nav span{display:inline-block;overflow:hidden;white-space:nowrap;max-width:170px;margin-left:8px;opacity:1;transition:max-width .5s cubic-bezier(.45,0,.2,1),margin-left .5s cubic-bezier(.45,0,.2,1),opacity .4s ease}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs.hn .nav:not([aria-current="page"]) span{max-width:0;margin-left:0;opacity:0}
.nav:hover{color:var(--text)}
.nav:hover::before{opacity:1}
.nav[aria-current="page"],.nav[aria-current="page"]:hover{background:none;color:var(--on-accent);font-weight:700}
.nav[aria-current="page"]::before{opacity:0}
.nav[aria-current="page"] span{animation:lbl .6s ease}
@keyframes lbl{from{opacity:0}to{opacity:1}}
#view.pg>*:not(.grid):not(.glist),#view.pg .grid>*,#view.pg .glist>*{animation:mid .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes mid{from{opacity:0;transform:scale(.94);clip-path:inset(-24px 50% -24px 50%)}to{opacity:1;transform:none;clip-path:inset(-24px -24px -24px -24px)}}

.noanim #view.pg>*,.noanim #view.pg .grid>*,.noanim #view.pg .glist>*,.noanim .nav[aria-current="page"] span{animation:none}
.noanim .nav,.noanim .nav span,.noanim .nav::before{transition:none}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 40%,transparent);border-radius:10px;border:3px solid transparent;background-clip:padding-box;min-height:40px;transition:background-color .2s}

.wip{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;text-align:center}
.wip .st{height:14px;opacity:.16;background:repeating-linear-gradient(-45deg,var(--text) 0 12px,transparent 12px 24px);background-size:34px 34px;animation:wipM 1.6s linear infinite}

.noanim .wip .st{animation:none}
.wip .wb{padding:52px 24px}

.wip .bd{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:14px}

.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}

.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.chk::after{content:"";width:10px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .2s cubic-bezier(.2,.8,.2,1)}

html.glass.glass[data-cline]{--g-rim:color-mix(in srgb,var(--line) 60%,transparent);--g-top:color-mix(in srgb,var(--line) 90%,transparent)}
.crow b{font-weight:600;color:var(--muted);min-width:64px;text-align:right;font-size:.85em}
.crow .x{width:auto;height:auto;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:var(--panel2);font-size:.8em;font-weight:600;box-shadow:none;color:var(--text)}

/* --- v8.91: Texture Tool Kit (tool-ttk.js) --- */
.tk-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.9fr);gap:16px;align-items:start}
.tk-l{min-width:0;transition:border-color .2s ease,box-shadow .2s ease}.tk-l.over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tk-l .drop{margin:0;padding:56px 16px}
.tk-fi{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:2px 0 12px;font-size:.88em;color:var(--muted)}
.tk-fi b{color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.05em}
.tk-fi em{font-style:normal;font-size:.78em;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.tk-sr{display:flex;gap:8px;margin-bottom:12px}.tk-q{flex:1;min-width:0;width:auto}.tk-dsel{width:auto;max-width:46%;flex:none}
.tk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:min(62vh,640px);overflow:auto;padding:2px}
.tk-it{display:flex;align-items:center;gap:10px;min-width:0;padding:7px;border:1px solid var(--line);border-radius:calc(var(--r) - 2px);background:var(--panel2);cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
.tk-it:hover{border-color:var(--muted)}.tk-it[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.tk-it.dz{border-color:var(--accent);background:var(--panel)}
.tk-it:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tk-th{flex:none;width:56px;height:56px;border-radius:calc(var(--r) - 6px);overflow:hidden;display:grid;place-items:center;background-color:#7774;background-image:linear-gradient(45deg,#8884 25%,transparent 25%,transparent 75%,#8884 75%),linear-gradient(45deg,#8884 25%,transparent 25%,transparent 75%,#8884 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.tk-th img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.tk-th i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--muted);animation:tkSpin .9s linear infinite}
@keyframes tkSpin{to{transform:rotate(360deg)}}
body.noanim .tk-th i{animation:none}
.tk-tx{min-width:0;display:grid;gap:2px}.tk-tx b{font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tk-tx small{color:var(--muted);font-size:.76em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-em{margin:18px 0;text-align:center;color:var(--muted)}
.tk-note{margin:0 0 12px}.tk-note:empty{display:none}
.tk-r{display:grid;gap:16px;min-width:0}
.tk-stage{width:100%;height:clamp(200px,34vh,360px);display:grid;place-items:center;overflow:hidden;box-sizing:border-box}
.tk-stage img{width:100%;height:100%;object-fit:contain;display:block}.tk-stage img.px{image-rendering:pixelated}.tk-stage{position:relative}.tk-stage img.lq{filter:blur(1.5px);opacity:.8}.tk-ld{position:absolute;right:10px;top:10px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--text);animation:tkSpin .9s linear infinite}body.noanim .tk-ld{animation:none}.tk-ph{color:var(--muted);font-size:.9em;padding:12px;text-align:center}
.tk-pv .ddfh{flex-wrap:wrap;gap:8px}.tk-pv .ddfh .seg{flex:none;flex-wrap:nowrap}.tk-pv .ddfh .seg button{padding:4px 10px;font-size:.82em;white-space:nowrap}
.tk-pi{margin:10px 0 0;font-size:.82em;color:var(--muted);min-height:1.2em;word-break:break-all}
.tk-b{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}.tk-b .mini{margin:0}.tk-b .mini:disabled{opacity:.4;cursor:default}
.tk-ef{display:inline-flex;align-items:center;gap:8px;font-size:.82em;color:var(--muted);margin-left:auto}.tk-ef .seg button{padding:4px 10px;font-size:.9em}
.tk-del.arm{background:#ef4444;border-color:#ef4444;color:#fff}
.tk-hint{margin:2px 0 10px;font-size:.82em;color:var(--muted);line-height:1.45}
.tk-sl{font-size:.82em;color:var(--muted)}
.tk-sv{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.tk-sv .go{margin:0 0 10px}.tk-sv .go.arm{background:#ef4444;color:#fff}
.tk-ac .dsec{margin-top:4px}
html.glass .tk-it{background:var(--g-fill),var(--panel2);border-color:var(--g-rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 8px rgba(0,0,0,.25)}
html.glass .tk-it[aria-pressed="true"],html.glass .tk-it.dz{border-color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px var(--accent)}
@media(max-width:1100px){.tk-g{grid-template-columns:1fr}}
/* --- v8.87: окно выбора цвета (colorpop.js) в стиле стекла; всё берётся из тех же переменных, что и карточки --- */
html.glass .mhp{background:var(--g-fill),var(--panel),color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid var(--g-rim);border-radius:calc(var(--r) + 6px);
  -webkit-backdrop-filter:blur(max(calc(var(--gb)*1px),16px)) saturate(150%);backdrop-filter:blur(max(calc(var(--gb)*1px),16px)) saturate(150%);
  box-shadow:inset 0 1px 0 var(--g-top),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 14px 22px -14px var(--g-glow),inset 0 -16px 26px -18px var(--g-blue),0 18px 44px -10px var(--g-sh)}
html.glass .mhp-sv,html.glass .mhp-hue{border-radius:calc(var(--r) - 2px);box-shadow:inset 0 0 0 1px var(--g-rim),0 2px 8px rgba(0,0,0,.25)}
html.glass .mhp-hue{border-radius:999px}
html.glass .mhp-f input,html.glass .mhp-eye{background:var(--g-fill),var(--panel2);border-color:var(--g-rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 8px rgba(0,0,0,.25)}
html.glass .mhp-pv{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1px var(--g-rim),0 3px 10px rgba(0,0,0,.3)}
html.glass.g2 .mhp{box-shadow:inset 0 1px 0 var(--g-top),inset 0 0 0 1px rgba(90,120,255,.12),inset 0 14px 22px -14px var(--g-glow),inset 0 -16px 26px -16px var(--g-blue),0 0 22px -8px rgba(80,110,255,.4),0 18px 44px -10px var(--g-sh)}
html.glass.g3 .mhp{border-width:1.5px;border-radius:calc(var(--r) + 14px);box-shadow:inset 0 2px 0 var(--g-top),inset 0 -2px 0 rgba(255,255,255,.22),inset 0 0 18px rgba(255,255,255,.08),inset 0 -18px 28px -16px var(--g-blue),0 18px 44px -10px var(--g-sh)}
html.glass.g3 .mhp-f input,html.glass.g3 .mhp-eye{border-radius:999px}
/* автообновление (v8.115): уведомление сверху */
.upd{position:fixed;top:var(--gap);left:50%;z-index:90;width:min(440px,calc(100vw - 300px));min-width:300px;display:flex;gap:12px;align-items:center;padding:12px 16px;background:linear-gradient(var(--panel),var(--panel)),var(--bg);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);color:var(--text);box-shadow:0 14px 34px -10px rgba(0,0,0,.55);pointer-events:none;-webkit-app-region:no-drag;transform:translate(-50%,-170%);opacity:0;transition:transform .7s cubic-bezier(.2,1.2,.35,1),opacity .35s ease}
.upd.in{transform:translate(-50%,0);opacity:1}
:root[data-theme="light"] .upd{box-shadow:0 14px 34px -12px rgba(0,0,0,.25)}
.upd-i{flex:none;width:34px;height:34px;border-radius:calc(var(--r) - 2px);background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.upd-i svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.upd-b{min-width:0;flex:1}
.upd-t{font-weight:600;font-size:14px;line-height:1.35}
.upd-s{font-size:12px;color:var(--muted);margin-top:2px}
.upd-s:empty{display:none}
.upd-p{height:4px;border-radius:999px;background:var(--panel2);margin-top:9px;overflow:hidden;display:none}
.upd-p i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .25s ease}
.upd.pr .upd-p{display:block}
.upd.er .upd-i{background:var(--panel2);color:var(--text)}
html.glass .upd{background:var(--g-fill),linear-gradient(var(--panel),var(--panel)),var(--bg);border-color:var(--g-rim);border-radius:calc(var(--r) + 8px);box-shadow:inset 0 1px 0 var(--g-top),0 14px 34px -10px var(--g-sh)}
.noanim .upd{transition:opacity .2s ease}

 tipList:["Работай в отдельной папке проекта, а не прямо в папке игры. Готовый результат копируй в игру уже после сборки.", "Меняй что-то одно и сразу проверяй в игре. Так видно, что именно сломалось.", "Храни исходники (.blend, .psd и т.д.) отдельно: из готовых игровых файлов их не восстановить.", "Сохраняй версии проекта: v1, v2, v3. Не перезаписывай рабочий файл, так проще откатиться.", "Размеры текстур лучше делать степенью двойки: 256, 512, 1024, 2048. Так игра работает с ними быстрее и стабильнее.", "Не делай огромные текстуры на мелкие детали. 4K на пуговицу съест память и просадит FPS.", "Следи за количеством полигонов: каждый лишний полигон видят все игроки рядом. Мелкие детали лучше передавать нормал-картой.", "Делай упрощённые версии модели (LOD) для дальних дистанций: это заметно экономит FPS.", "Называй файлы только латиницей, цифрами и подчёркиванием, без пробелов и русских букв. Так меньше ошибок загрузки.", "Перед экспортом примени масштаб и поворот модели и проверь размеры. Модель должна совпадать по размеру с оригиналом.", "Проверяй UV-развёртку: растяжения и швы в игре заметнее, чем в редакторе.", "Открой похожий оригинальный файл игры (например, в CodeWalker или OpenIV) и повтори его структуру. Так меньше сюрпризов.", "Проверь коллизию: без неё сквозь предмет можно пройти, а с кривой можно застрять.", "Тестируй мод при разном освещении: днём, ночью, в дождь. Блики и металл выглядят по-разному.", "Если мод не загружается, загляни в лог ошибок: там часто указан проблемный файл.", "Дели большой мод на части и собирай по кусочкам. Так ошибку найти проще.", "Убери из пакета неиспользуемые текстуры и материалы: меньше вес, быстрее загрузка.", "Проверь мод на слабом ПК или на низких настройках графики, прежде чем показывать другим.", "Не используй чужие модели и текстуры без разрешения автора. Если берёшь, указывай автора.", "Перед созданием мода узнай правила своего RP-сервера: что там разрешено. Лучше выяснить заранее, чем делать впустую.", "Перед публикацией пройдись по чек-листу: запускается, нет вылетов, нет чёрных или белых текстур, FPS не просел."],

 tipList:["Work in a separate project folder, not directly in the game folder. Copy the finished result into the game only after you build it.", "Change one thing at a time and check it in the game right away. That way you see exactly what broke.", "Keep your source files (.blend, .psd, etc.) separately: you can't restore them from the finished game files.", "Save project versions: v1, v2, v3. Don't overwrite the working file, it makes rolling back easier.", "Make texture sizes a power of two: 256, 512, 1024, 2048. The game handles them faster and more reliably.", "Don't make huge textures for tiny details. A 4K texture on a button eats memory and drops your FPS.", "Watch the polygon count: every extra polygon is seen by all players nearby. Use a normal map for small details.", "Make simplified versions of the model (LODs) for long distances: it saves a lot of FPS.", "Name files with Latin letters, digits and underscores only, no spaces or Cyrillic. Fewer loading errors.", "Before exporting, apply the model's scale and rotation and check its size. It should match the original's size.", "Check the UV map: stretching and seams show up in the game more than in the editor.", "Open a similar original game file (for example, in CodeWalker or OpenIV) and copy its structure. Fewer surprises.", "Check collision: without it you walk through the object, and a bad one can get you stuck.", "Test the mod in different lighting: day, night, rain. Highlights and metal look different.", "If the mod won't load, look at the error log: it often names the problem file.", "Split a big mod into parts and assemble it piece by piece. The error is easier to find.", "Remove unused textures and materials from the package: smaller size, faster loading.", "Test the mod on a weak PC or low graphics settings before showing it to others.", "Don't use other people's models and textures without the author's permission. If you do, credit the author.", "Before making a mod, learn your RP server's rules: what is allowed there. Better to find out first than to work for nothing.", "Before publishing, run through a checklist: it launches, no crashes, no black or white textures, FPS didn't drop."],

var UPD={s:null,el:null,shown:0};

function updText(){
  var e=UPD.el,s=UPD.s;if(!e||!s)return;var L=t(),p=Number(s.pct)||0,ph=s.phase,tx="";
  if(ph==="available")tx=L.updA;else if(ph==="downloading")tx=L.updD.replace("{p}",p);else if(ph==="installing")tx=L.updI;else if(ph==="error")tx=L.updE;

  e.classList.toggle("pr",ph==="downloading"||ph==="installing");e.classList.toggle("er",ph==="error");
  e.querySelector(".upd-p i").style.width=(ph==="installing"?100:p)+"%";
}

function updWhenReady(cb){(function w(){if(document.getElementById("splash")||document.getElementById("setup"))setTimeout(w,300);else cb()})()}
function updApply(s){
  if(!s||s.phase==="idle")return;UPD.s=s;
