<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Hate Mods</title>
<style>
@font-face{font-family:'Unbounded';font-weight:700;src:url(fonts/unbounded-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Unbounded';font-weight:700;src:url(fonts/unbounded-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{--bg:#07080a;--panel:#0d0f12;--panel2:#15181c;--text:#eceef1;--muted:#868d97;--line:#1c2026;--r:12px}
:root[data-t="light"]{--bg:#f3f3f1;--panel:#ffffff;--panel2:#ebebe8;--text:#1b1d21;--muted:#6b7078;--line:#d9dad6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:var(--text)}
.hd{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none}
.hd .l{display:flex;align-items:center;gap:10px;min-width:0}
.hd img{width:28px;height:28px;border-radius:8px;image-rendering:pixelated}
.hd h1{margin:0;font:700 .86em/1.2 Unbounded,Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:flex;gap:8px;flex:none}
.x{-webkit-app-region:no-drag;width:34px;height:34px;flex:none;padding:0;display:grid;place-items:center;border-radius:calc(var(--r) - 2px);border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;transition:background-color .2s ease,color .2s ease}
.x:hover{background:var(--panel2);color:var(--text)}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><div class="hd"><div class="l"><img src="hatemods.png" alt=""><h1 id="t">Hate Mods Site</h1></div><div class="bt"><button class="x" id="m" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><button class="x" id="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
<script>
var q=new URLSearchParams(location.search);
document.documentElement.setAttribute("data-t",q.get("t")==="light"?"light":"dark");
if(q.get("title"))document.getElementById("t").textContent=q.get("title");
document.getElementById("x").addEventListener("click",function(){if(window.bw)window.bw.close();else window.close()});
document.getElementById("m").addEventListener("click",function(){if(window.bw)window.bw.min()});
</script></body></html>
