:root{--bg:#07080a;--panel:#0d0f12;--panel2:#15181c;--text:#eceef1;--muted:#868d97;--line:#1c2026;--isl:#0a0b0e;--gap:10px;--accent:#ffffff;--on-accent:#07080a;--logo:#ffffff;--r:12px;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3f3f1;--isl:#f8f8f6;--panel:#ffffff;--panel2:#ebebe8;--text:#1b1d21;--muted:#6b7078;--line:#d9dad6;--accent:#1b1d21;--on-accent:#ffffff;--logo:#1b1d21;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;-webkit-user-select:none;user-select:none;cursor:default;background:var(--bg)}
body{color:var(--text);font:400 15px/1.55 Manrope,system-ui,"Segoe UI",sans-serif;overflow:hidden}
h1,h2{font-family:Unbounded,Manrope,system-ui,sans-serif;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%;padding:var(--gap);gap:var(--gap)}
.top{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);height:46px;padding:0 6px 0 16px;display:flex;align-items:center;justify-content:space-between;-webkit-app-region:drag}
.top b{font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:13px;letter-spacing:.02em}
.top span{color:var(--muted);font-weight:500;margin-left:10px;font-size:13px}
#wc{display:flex;gap:4px;-webkit-app-region:no-drag}
#wc button{width:34px;height:34px;padding:0;border:0;border-radius:calc(var(--r) - 2px);background:none;color:var(--muted);display:grid;place-items:center;transition:background-color .2s ease,color .2s ease,transform .15s ease}
#wc button:hover{background:var(--panel2);color:var(--text)}
#wc button:active{transform:scale(.92)}
#wc button.x:hover{background:#d6343b;color:#fff}
#wc svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
body.busy #wc .x{opacity:.3;pointer-events:none}
.isl{position:relative;background:var(--isl);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden}
.sc{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 56px;text-align:center}
.sc.on{display:flex}
.sc.on>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*55ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lg{display:block;flex:none;overflow:visible;aspect-ratio:1260/705;width:170px}
.lg .fl{fill:var(--logo)}
.lg .lo{fill:none;stroke:var(--logo);stroke-width:20;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.sc.on .lg .lo{animation:draw .9s ease forwards,fade .4s ease .9s forwards}
.sc.on .lg .fl{animation:fillIn .6s ease .6s both}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes fade{to{opacity:0}}
@keyframes fillIn{from{opacity:0}to{opacity:1}}
h1{font-size:25px;font-weight:700;margin-top:22px}
h2{font-size:21px;font-weight:700}
.sub{color:var(--muted);margin:8px 0 0;max-width:430px}
.row{display:flex;gap:22px;margin-top:26px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.lbl{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:9px 16px;font-weight:600;transition:border-color .25s ease,box-shadow .25s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.opt:hover{border-color:var(--muted)}
.opt:active{transform:scale(.96)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btns{display:flex;gap:10px;margin-top:28px;width:100%;max-width:440px}
.go,.bk{padding:13px 22px;border-radius:calc(var(--r) - 2px);font-weight:700;border:1px solid var(--line);transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .25s ease,border-color .25s ease}
.go{flex:1;border:0;background:var(--accent);color:var(--on-accent)}
.bk{background:var(--panel2)}
.bk:hover{border-color:var(--muted)}
.go:active,.bk:active{transform:scale(.97)}
.go:disabled{opacity:.4;pointer-events:none}
.pathbox{display:flex;gap:8px;width:100%;max-width:520px;margin-top:20px}
.path{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:11px 14px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.path bdi{direction:ltr;unicode-bidi:isolate}
.hint{color:var(--muted);font-size:13px;margin-top:8px;max-width:520px;text-align:left;width:100%}
.chks{display:flex;flex-direction:column;gap:12px;margin-top:22px;width:100%;max-width:520px;align-items:flex-start}
.ck{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;font-weight:500;text-align:left}
.chk{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;transition:background-color .2s ease,border-color .2s ease}
.chk::after{content:"";width:10px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.ck[aria-checked="true"] .chk{background:var(--accent);border-color:var(--accent)}
.ck[aria-checked="true"] .chk::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.bar{width:100%;max-width:460px;height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:26px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .15s linear}
.pct{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:30px;margin-top:20px}
.file{color:var(--muted);font-size:12px;margin-top:10px;max-width:460px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;min-height:18px}
.err{color:var(--muted);font-size:12px;margin-top:12px;max-width:520px;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:10px 12px;text-align:left;user-select:text}
.okic{width:64px;height:64px;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.okic svg{width:30px;height:30px;stroke:var(--on-accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
</style></head><body>

function go(id){document.querySelectorAll(".sc").forEach(function(s){s.classList.toggle("on",s.id===id);if(s.id===id)Array.prototype.forEach.call(s.children,function(c,k){c.style.setProperty("--k",k)})})}
function tog(id,key){var b=$(id);b.addEventListener("click",function(){S[key]=!S[key];b.setAttribute("aria-checked",String(S[key]))})}
tog("cDesk","desk");tog("cMenu","menu");tog("cRun","run");
document.querySelectorAll("#oLang .opt").forEach(function(b){b.addEventListener("click",function(){S.lang=b.dataset.v;save();render()})});
document.querySelectorAll("#oTheme .opt").forEach(function(b){b.addEventListener("click",function(){S.dark=b.dataset.v==="dark";save();window.api.setTheme(S.dark);render()})});
$("n0").addEventListener("click",function(){go("s1")});
$("b1").addEventListener("click",function(){go("s0")});
$("browse").addEventListener("click",function(){window.api.pickDir(S.dir).then(function(p){if(p){S.dir=p;render()}})});
$("bmin").addEventListener("click",function(){window.api.min()});
$("bx").addEventListener("click",function(){window.api.close()});
$("n3").addEventListener("click",function(){if(S.run)window.api.launch(S.dir);else window.api.close()});
$("n4").addEventListener("click",function(){window.api.close()});
$("b4").addEventListener("click",function(){go("s1")});
window.api.onProgress(function(p,f){var v=Math.round(p*100);$("fill").style.width=v+"%";txt("pct",v+"%");txt("file",f)});
$("n1").addEventListener("click",function(){
  document.body.classList.add("busy");$("fill").style.width="0";txt("pct","0%");txt("file","");go("s2");
  window.api.install({dir:S.dir,desktop:S.desk,startmenu:S.menu}).then(function(r){
    document.body.classList.remove("busy");
    if(r&&r.ok){S.dir=r.dir;go("s3")}else{txt("err",String(r&&r.error||"Unknown error"));go("s4")}
  })
});
window.api.init().then(function(i){
  S.dir=i.dir;S.mb=i.mb;S.ok=i.ok;txt("ver","v"+i.version);
  window.api.setTheme(S.dark);render();go("s0")
});
</script></body></html>
